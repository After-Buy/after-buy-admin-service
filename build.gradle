plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.12'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.After_Buy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 시스템 헬스 체크 및 모니터링 (Docker 컨테이너 상태 체크용)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 데이터베이스 ORM 및 관리자/통계 정보 엔티티 관리 (admin_db 연동)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 관리자 외 비인가 권한 접근 차단 (세션 쿠키 기반 관리자 인증 / 세션 관리)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// 클라이언트 입력 데이터 유효성 검사 (@Valid 등 적용)
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// 관리자 웹 서비스 REST API 엔드포인트 구축
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 통계 수집용 타 마이크로서비스 내부망 호출 (WebClient)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// API 명세서 포맷 자동 생성 및 Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'

	// DTO 및 엔티티 코드 다이어트용 Lombok (Getter, Setter)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// AWS RDS MySQL 구동용 공식 JDBC Database 드라이버
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 스프링 기본 통합 테스트 모듈 세트
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// WebFlux(WebClient) 외부 연동 모듈 단위 테스트용
	testImplementation 'io.projectreactor:reactor-test'
	// 권한/시큐리티 설정 연관 통합 테스트용
	testImplementation 'org.springframework.security:spring-security-test'
	// JUnit5 플랫폼 로드 엔진
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
