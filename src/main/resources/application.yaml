server:
  port: 8084
  forward-headers-strategy: framework

spring:
  application:
    name: AdminService

  # env 파일 내의 환경변수를 불러오는 설정 (확장자가 없으므로 properties 형식으로 강제 파싱)
  config:
    import: optional:file:.env[.properties]

  # 데이터베이스(MySQL) 연결 설정 (admin_db)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA(Hibernate) 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# CORS 허용 Origin 설정
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
