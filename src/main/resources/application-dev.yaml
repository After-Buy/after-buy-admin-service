# Dev 환경 전용 설정
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /api/admin/swagger-ui.html
  api-docs:
    path: /api/admin/v3/api-docs

logging:
  level:
    root: INFO
    com.After_Buy: DEBUG
